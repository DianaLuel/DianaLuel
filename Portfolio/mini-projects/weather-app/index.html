<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="styles.css">
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/weather-icons/2.0.12/css/weather-icons.min.css"
    >
</head>
<body>
    <div class="weather-app">
        <div class="left-section">
            <div class="upper-section">
                <h2 class="day">Tuesday</h2>
                <p class="date">20 Jun 2022</p>
                <p class="location"> <i class="fa-solid fa-location-dot"></i>New York, US</p>
            </div>
            <div class="lower-section">
                <div class="weather-icon">
                    <i class="wi wi-day-sunny"></i>
                </div>
                <div class="temperature">
                    <h1 class="temperature-value">29°C</h1>
                    <p class="weather-description">Sunny</p>
                </div>
        </div>
        </div>
        <div class="right-section">
            <div class="weather-details">
                <div class="titles">
                    <h2>PRECIPITATION</h2>
                    <h2>HUMIDITY</h2>
                    <h2>WIND</h2>
                </div>

                <div class="values">
                    <p>0%</p>
                    <p>42%</p>
                    <p>3 km/h</p>
                </div>
            </div>

            <div class="forecast">
                <div class="day1">
                    <i class="wi wi-day-sunny"></i>
                    <p class="forecast-day">Tue</p>
                    <p class="forecast-temperature">28°C</p>
                </div>
                <div class="day2">
                    <i class="wi wi-day-cloudy"></i>
                    <p class="forecast-day">Wed</p>
                    <p class="forecast-temperature">30°C</p>
                </div>
                <div class="day3">
                    <i class="wi wi-day-rain"></i>
                    <p class="forecast-day">Thu</p>
                    <p class="forecast-temperature">27°C</p>
                </div>
                <div class="day4">
                    <i class="wi wi-day-sunny"></i>
                    <p class="forecast-day">Fri</p>
                    <p class="forecast-temperature">26°C</p>
                </div>
            </div>
            <button class="change-location"> 
                <i>location icon</i> 
                Change Location</button>
        </div>
    </div>
</body>
</html>
